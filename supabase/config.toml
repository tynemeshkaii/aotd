project_id = "album-of-the-day"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "albumoftheday://"
additional_redirect_urls = ["albumoftheday://**", "exp://**"]
jwt_expiry = 3600
enable_signup = true

[functions.upsert-streaming-connection]
verify_jwt = false

[functions.refresh-spotify-token]
verify_jwt = false

[functions.sync-spotify-library]
verify_jwt = false

[functions.compute-album-of-the-day]
verify_jwt = false

[functions.dispatch-daily-picks]
verify_jwt = false

[functions.prewarm-album-cache]
verify_jwt = false
